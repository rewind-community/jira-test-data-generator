name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ruff
        # Install ruff at the version pinned in requirements-dev.txt, using it as a pip
        # constraints file. This keeps a single source of truth for the version — CI and
        # local development cannot drift, and there is no second pin to keep in sync.
        # Only ruff is installed; the other entries act purely as constraints.
        run: pip install ruff -c requirements-dev.txt

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .
